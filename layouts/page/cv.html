{{ define "main" }}
<div class="cv-page">
    <div class="container">
        <div class="cv-header">
            <h1>{{ .Title }}</h1>
            <a href="MyWebsite/static/img/CV.pdf" class="cv-download-btn" download>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download CV (PDF)
            </a>
        </div>

        <div class="cv-preview">
            <iframe src="MyWebsite/static/img/CV.pdf" class="cv-iframe"
                title="CV Preview"></iframe>
        </div>

        <div class="cv-note">
            <p><strong>Note:</strong> If the preview doesn't load, please use the download button above to view the PDF.
            </p>
        </div>
    </div>
</div>
{{ end }}
